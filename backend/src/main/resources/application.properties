spring.application.name=scrabble

# Render/Railway/etc commonly provide PORT
server.port=${PORT:8080}

# Comma-separated list of allowed origins for the frontend (no trailing slashes).
# Example: https://your-frontend.vercel.app,https://adamschrofel.github.io
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}